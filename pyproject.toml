[project]
name = "air-quality-mcp"
version = "0.1.0"
description = "MCP server for air quality report automation"
requires-python = ">=3.11"

dependencies = [
    "mcp>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "windrose>=1.9.0",
]

[project.scripts]
air-quality-mcp = "server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pdf = ["weasyprint>=60.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills"]
